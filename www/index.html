<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>var VER=1;(function(){try{var h=localStorage.getItem('appHtml');if(h&&+localStorage.getItem('appVer')>VER){document.open();document.write(h);document.close();}}catch(e){}})();</script>
<style>
:root{--bg:#0f1a33;--c:#1b2a4d;--a:#4ea1ff;--t:#fff}
@media(prefers-color-scheme:light){:root{--bg:#f2f5fb;--c:#fff;--t:#111}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font-family:sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:70px}
header{display:flex;gap:8px;padding:10px;position:sticky;top:0;background:var(--bg);z-index:5}
header b{align-self:center}input,button{border:0;border-radius:10px;padding:10px;background:var(--c);color:var(--t);font-size:15px}
#q{flex:1;min-width:0}#chips{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px}
#chips button{white-space:nowrap}#chips .on{background:var(--a);color:#fff}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px}
.cd{background:var(--c);border-radius:12px;padding:8px;text-align:center;position:relative;cursor:pointer}
.cd img{width:64px;height:64px;object-fit:contain}.cd p{font-size:13px;margin-top:6px;overflow:hidden;max-height:34px}
.st{position:absolute;top:2px;left:2px;background:none;padding:4px}
.m{padding:20px;opacity:.7;grid-column:1/-1;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;font-size:12px}nav .on{color:var(--a)}
#player{position:fixed;inset:0;background:#000;z-index:10}#player[hidden]{display:none}
#v{width:100%;height:100%}#pt{position:absolute;top:10px;right:60px;color:#fff;text-shadow:0 0 4px #000}
#pc{position:absolute;top:8px;right:8px;background:#0008;color:#fff}
.f{padding:14px;display:grid;gap:8px;grid-column:1/-1}
</style></head><body>
<header><b>Smart IPTV</b><input id="q" placeholder="ابحث عن قناة أو فيلم..."><button id="upd" title="تحديث">🔄</button></header>
<div id="chips"></div><main id="list"></main>
<nav id="nav"><button data-t="live" class="on">📺<br>قنوات</button><button data-t="movies">🎬<br>أفلام</button><button data-t="series">🎞️<br>مسلسلات</button><button data-t="fav">❤️<br>المفضلة</button><button data-t="set">⚙️<br>إعدادات</button></nav>
<div id="player" hidden><video id="v" controls autoplay playsinline></video><div id="pt"></div><button id="pc">✕</button></div>
<script>
const BASE='https://zarzouramahmoudabdo-commits.github.io/smart-iptv/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const get=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.text()};
const FREE={ara:['عربي','languages/ara'],eg:['مصر','countries/eg'],sports:['رياضة','categories/sports'],news:['أخبار','categories/news'],movies:['أفلام','categories/movies'],kids:['أطفال','categories/kids'],ent:['ترفيه','categories/entertainment'],music:['موسيقى','categories/music']};
let tab='live',cat='ara',grp='',items=[],all=[],favs=L('favs',[]),xt=L('xt',null),pl=L('pl',null),lim=200,hls=null,cache={};
const mode=()=>xt?'xt':pl?'pl':'free';

function parseM3U(t){const o=[];let m=null;for(const ln of t.split(/\r?\n/)){if(ln.startsWith('#EXTINF')){m={name:ln.split(',').slice(1).join(',').trim(),logo:(ln.match(/tvg-logo="([^"]*)"/)||[])[1]||'',grp:(ln.match(/group-title="([^"]*)"/)||[])[1]||''}}else if(m&&/^https?:/.test(ln.trim())){m.url=ln.trim();o.push(m);m=null}}return o}
const xa=(a,e='')=>get(`${xt.s}/player_api.php?username=${encodeURIComponent(xt.u)}&password=${encodeURIComponent(xt.p)}&action=${a}${e}`).then(JSON.parse);
const xu=(k,id,ext)=>`${xt.s}/${k}/${encodeURIComponent(xt.u)}/${encodeURIComponent(xt.p)}/${id}${ext?'.'+ext:''}`;

async function loadData(){
  if(tab==='live'){
    if(mode()==='xt'){const[c,s]=await Promise.all([xa('get_live_categories'),xa('get_live_streams')]);const cm={};c.forEach(x=>cm[x.category_id]=x.category_name);return s.map(x=>({name:x.name,logo:x.stream_icon,grp:cm[x.category_id]||'',url:xu('live',x.stream_id,'m3u8')}))}
    if(mode()==='pl')return parseM3U(await get(pl));
    const k=FREE[cat][1];if(cache[k])return cache[k];
    let t;try{t=await get(`https://iptv-org.github.io/iptv/${k}.m3u`);S('c_'+k,t.slice(0,900000))}catch(e){t=L('c_'+k,null);if(!t)throw e}
    return cache[k]=parseM3U(t)}
  if(!xt)return null;
  if(tab==='movies'){const[c,s]=await Promise.all([xa('get_vod_categories'),xa('get_vod_streams')]);const cm={};c.forEach(x=>cm[x.category_id]=x.category_name);return s.map(x=>({name:x.name,logo:x.stream_icon,grp:cm[x.category_id]||'',url:xu('movie',x.stream_id,x.container_extension||'mp4')}))}
  if(tab==='series'){const[c,s]=await Promise.all([xa('get_series_categories'),xa('get_series')]);const cm={};c.forEach(x=>cm[x.category_id]=x.category_name);return s.map(x=>({name:x.name,logo:x.cover,grp:cm[x.category_id]||'',sid:x.series_id}))}
}
async function refresh(){
  const l=$('#list');
  if(tab==='set')return settings();
  if(tab==='fav'){all=favs;}
  else{l.innerHTML='<p class=m>جارٍ التحميل…</p>';
    try{all=await loadData();if(all===null){l.innerHTML='<p class=m>سجّل دخول Xtream من الإعدادات لعرض هذا القسم.</p>';$('#chips').innerHTML='';return}}
    catch(e){l.innerHTML='<p class=m>تعذّر التحميل، تأكد من الإنترنت وحاول تاني.</p>';return}}
  grp='';lim=200;chips();draw();
}
function chips(){
  const c=$('#chips');let h='';
  if(tab==='live'&&mode()==='free')h=Object.entries(FREE).map(([k,v])=>`<button data-c="${k}" class="${k===cat?'on':''}">${v[0]}</button>`).join('');
  else if(tab!=='fav'){const g=[...new Set(all.map(x=>x.grp).filter(Boolean))].slice(0,60);h=g.length?`<button data-g="" class="on">الكل</button>`+g.map(x=>`<button data-g="${esc(x)}">${esc(x)}</button>`).join(''):''}
  c.innerHTML=h;
}
function draw(){
  const q=$('#q').value.trim().toLowerCase();
  items=all.filter(x=>(!grp||x.grp===grp)&&(!q||x.name.toLowerCase().includes(q)));
  const l=$('#list');
  if(!items.length){l.innerHTML='<p class=m>لا توجد نتائج.</p>';return}
  l.innerHTML=items.slice(0,lim).map((x,i)=>`<div class="cd" data-i="${i}"><button class="st" data-f="${i}">${favs.some(f=>f.url===x.url&&f.name===x.name)?'❤️':'🤍'}</button><img loading="lazy" src="${esc(x.logo)}" onerror="this.style.visibility='hidden'"><p>${esc(x.name)}</p></div>`).join('')+(items.length>lim?'<button class="m" data-more="1">عرض المزيد</button>':'');
}
function settings(){
  $('#chips').innerHTML='';
  $('#list').innerHTML=`<div class="f"><h3>اشتراك Xtream</h3><input id="xs" placeholder="http://server:port" value="${esc(xt?.s||'')}"><input id="xu" placeholder="اسم المستخدم" value="${esc(xt?.u||'')}"><input id="xp" type="password" placeholder="كلمة السر" value="${esc(xt?.p||'')}"><button id="xsave">حفظ وتسجيل الدخول</button>
  <h3>رابط قائمة M3U</h3><input id="pu" placeholder="https://.../list.m3u" value="${esc(pl||'')}"><button id="psave">حفظ القائمة</button>
  <button id="reset">رجوع للقنوات المجانية</button><button id="upd2">🔄 تحقق من تحديث التطبيق</button><p class=m>الإصدار ${VER}</p></div>`;
}
async function upd(){
  try{const r=JSON.parse(await get(BASE+'version.json?t='+Date.now()));
    if(r.v>VER){const h=await get(BASE+'index.html?t='+Date.now());localStorage.setItem('appHtml',h);localStorage.setItem('appVer',String(r.v));alert('تم التحديث، هيتعمل إعادة تشغيل');location.reload()}
    else alert('أنت على آخر إصدار')}catch(e){alert('تعذّر التحديث، تأكد من الإنترنت')}
}
function play(it){
  $('#player').hidden=false;$('#pt').textContent=it.name;const v=$('#v');
  if(hls){hls.destroy();hls=null}
  v.onerror=()=>useHls(it);v.src=it.url;v.play().catch(()=>{});
}
async function useHls(it){
  const v=$('#v');v.onerror=null;
  if(!window.Hls)await new Promise(r=>{const s=document.createElement('script');s.src='hls.min.js';s.onload=r;s.onerror=r;document.head.appendChild(s)});
  if(window.Hls&&Hls.isSupported()&&/m3u8/.test(it.url)){hls=new Hls();hls.loadSource(it.url);hls.attachMedia(v)}
  else $('#pt').textContent=it.name+' — القناة لا تعمل حاليًا';
}
async function openSeries(it){
  $('#list').innerHTML='<p class=m>جارٍ التحميل…</p>';
  try{const d=await xa('get_series_info','&series_id='+it.sid);const eps=[];
    Object.values(d.episodes||{}).forEach(a=>a.forEach(e=>eps.push({name:`${it.name} - ${e.title||'حلقة '+e.episode_num}`,logo:it.logo,grp:'',url:xu('series',e.id,e.container_extension||'mp4')})));
    all=eps;chips();draw()}catch(e){$('#list').innerHTML='<p class=m>تعذّر تحميل الحلقات.</p>'}
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,.cd');if(!t)return;
  if(t.dataset.f!==undefined){e.stopPropagation();const x=items[+t.dataset.f];const i=favs.findIndex(f=>f.url===x.url&&f.name===x.name);i>=0?favs.splice(i,1):favs.push(x);S('favs',favs);if(tab==='fav')all=favs;draw();return}
  if(t.dataset.i!==undefined){const x=items[+t.dataset.i];x.sid?openSeries(x):play(x);return}
  if(t.dataset.more){lim+=200;draw();return}
  if(t.dataset.c){cat=t.dataset.c;refresh();return}
  if(t.dataset.g!==undefined){grp=t.dataset.g;lim=200;document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b===t));draw();return}
  if(t.dataset.t){tab=t.dataset.t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b===t));refresh();return}
  switch(t.id){
    case'upd':case'upd2':upd();break;
    case'pc':$('#v').pause();$('#v').removeAttribute('src');if(hls){hls.destroy();hls=null}$('#player').hidden=true;break;
    case'xsave':{let s=$('#xs').value.trim().replace(/\/+$/,'');if(!/^https?:\/\//.test(s))s='http://'+s;xt={s,u:$('#xu').value.trim(),p:$('#xp').value};try{await xa('get_live_categories');S('xt',xt);pl=null;S('pl',null);alert('تم تسجيل الدخول');tab='live';location.reload()}catch(err){xt=L('xt',null);alert('بيانات الاشتراك غير صحيحة أو السيرفر لا يستجيب')}break}
    case'psave':pl=$('#pu').value.trim()||null;S('pl',pl);xt=null;S('xt',null);alert('تم الحفظ');location.reload();break;
    case'reset':S('xt',null);S('pl',null);location.reload();break}
});
$('#q').addEventListener('input',()=>{lim=200;if(tab!=='set')draw()});
history.pushState&&document.addEventListener('backbutton',()=>{});
refresh();
</script></body></html>
