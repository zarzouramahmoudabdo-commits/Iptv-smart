name: Build APK
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: cp node_modules/hls.js/dist/hls.min.js www/hls.min.js
      - run: echo "{\"v\":$(grep -o 'var VER=[0-9]*' www/index.html | head -1 | cut -d= -f2)}" > www/version.json
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: Smart-IPTV-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
      - uses: peaceiris/actions-gh-pages@v4
        with: {github_token: "${{ secrets.GITHUB_TOKEN }}", publish_dir: ./www}
